[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screener-mcp"
version = "0.1.0"
description = "MCP server exposing screener.in financial data and filings to Claude"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gaurav Chandak" }]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
screener-mcp = "screener_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/screener_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
